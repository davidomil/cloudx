[project]
name = "cloudx-documentation-indexer"
version = "0.1.0"
description = "Portable Turbovec-backed documentation archive and retrieval service for Cloudx"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.14",
  "docling>=2.70,<3",
  "fastapi>=0.115",
  "faster-whisper>=1.1",
  "httpx>=0.28",
  "numpy>=2.0",
  "onnxruntime==1.27.0",
  "odfpy>=1.4",
  "openpyxl>=3.1",
  "pandas>=2.3",
  "pdfplumber>=0.11.9,<0.12",
  "pillow>=12.0",
  "pyxlsb>=1.0",
  "pydantic>=2.10",
  "pypdfium2>=5.9,<6",
  "python-multipart>=0.0.9",
  "torch>=2.7",
  "tokenizers==0.22.2",
  "turbovec==0.7.0",
  "uvicorn[standard]>=0.30",
  "xlrd>=2.0",
  "youtube-transcript-api>=1.2",
  "yt-dlp>=2026.3.17"
]

[project.scripts]
cloudx-documentation-indexer = "cloudx_documentation_indexer.main:main"
cloudx-documentation-model = "cloudx_documentation_indexer.semantic:main"

[project.optional-dependencies]
schematic = [
  "ultralytics==8.3.162",
  "torch==2.13.0",
  "torchvision==0.28.0"
]
dev = [
  "pytest>=8.0",
  "reportlab>=4.5",
  "xlwt>=1.3"
]
cuda = [
  "nvidia-cublas-cu12; sys_platform == 'linux'",
  "nvidia-cudnn-cu12==9.*; sys_platform == 'linux'"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = "==0.11.28"

[tool.uv.sources]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
