name: Classify Pull Request

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions: {}

concurrency:
  group: classify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Reject workflow reruns before using write authority
        env:
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: test "$GITHUB_RUN_ATTEMPT_VALUE" = "1"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Assert trusted classifier checkout
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reconcile path and review labels
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INVALIDATE_MERGE_INTENT: ${{ github.event.action == 'synchronize' || github.event.action == 'edited' }}
        run: node scripts/ai-change/github/classify-pr.mjs
