name: CloudX CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run verify:policy
      - run: npm audit --audit-level=high

  typescript:
    name: TypeScript (build, type-check, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck -- --pretty false
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm run test:coverage
      - run: npm run build

  asr:
    name: ASR (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: services/asr/uv.lock
      - run: uv lock --check --project services/asr
      - run: uv sync --locked --project services/asr --extra dev
      - run: uv run --locked --no-sync --project services/asr python -m pytest services/asr/tests -q

  documentation:
    name: Documentation indexer (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: services/documentation-indexer/uv.lock
      - run: uv lock --check --project services/documentation-indexer
      - run: uv sync --locked --project services/documentation-indexer --extra dev
      - run: uv run --locked --no-sync --project services/documentation-indexer python -m pytest services/documentation-indexer/tests -q

  python-services:
    name: Python services (pytest)
    if: always()
    needs: [asr, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Python service
        env:
          ASR_RESULT: ${{ needs.asr.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: node -e 'for (const [name, result] of Object.entries(process.env)) if (name.endsWith("_RESULT") && result !== "success") throw new Error(`${name} was ${result}`)'

  browser:
    name: Browser smoke (desktop and mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser

  isolated-verifier:
    name: Isolated full verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Build verifier from the exact test merge
        run: docker build --pull --tag cloudx-ci-verifier:${{ github.sha }} --file controller/containers/ci/Dockerfile controller
      - name: Run with no network and read-only source
        run: |
          install -d -m 0700 container-results
          install -m 0600 /dev/null container-results/results.json
          docker run --rm \
            --init \
            --network none \
            --read-only \
            --cap-drop ALL \
            --cap-add DAC_OVERRIDE \
            --cap-add SETUID \
            --cap-add SETGID \
            --cap-add KILL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 7g \
            --cpus 2 \
            --shm-size 1g \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=8g,mode=1777 \
            --volume "${PWD}/source:/source:ro" \
            --volume "${PWD}/container-results/results.json:/results/results.json:rw" \
            cloudx-ci-verifier:${{ github.sha }}
      - name: Upload exact verifier evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-verifier-${{ github.sha }}
          path: container-results/results.json
          if-no-files-found: error
          retention-days: 14

  identity:
    name: Trusted merge identity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: controller/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: controller
      - name: Record the exact tested merge from the trusted controller
        env:
          CI_IDENTITY_OUTPUT: ../ci-identity/identity.json
          CI_SOURCE_DIRECTORY: ../source
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          install -d -m 0700 ../ci-identity
          node scripts/ai-change/github/check-identity.mjs create-ci-artifact
        working-directory: controller
      - name: Upload the one trusted CI identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudx-ci-identity-v2
          path: ci-identity/identity.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: CI aggregate
    if: always()
    needs:
      [
        policy,
        typescript,
        python-services,
        browser,
        isolated-verifier,
        identity,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every merge gate
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          PYTHON_RESULT: ${{ needs.python-services.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          ISOLATED_VERIFIER_RESULT: ${{ needs.isolated-verifier.result }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          const expectedIdentity = process.env.WORKFLOW_EVENT === "pull_request" ? "success" : "skipped";
          for (const [name, result] of Object.entries(process.env)) {
            if (!name.endsWith("_RESULT")) continue;
            const expected = name === "IDENTITY_RESULT" ? expectedIdentity : "success";
            if (result !== expected) throw new Error(`${name} was ${result}; expected ${expected}`);
          }
          NODE
