name: CloudX CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: node scripts/ai-change/validate-process.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm audit --audit-level=high
  typescript:
    name: TypeScript (build, type-check, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Cache dependencies pinned by historical regression fixtures
        run: node scripts/ci/cache-historical-dependencies.mjs
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm run build
      - name: Verify host-only systemd and cgroup lifecycle
        run: npx vitest run scripts/managed-update-history.systemd.test.mjs scripts/managed-update-host.systemd.test.mjs scripts/managed-update-systemd.test.mjs scripts/install-runtime-caller.integration.test.mjs --maxWorkers=2 --reporter=dot --reporter=json --outputFile.json=test-results/timings/systemd.json
      - name: Upload host lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminal-diagnostics-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
  codex-native:
    name: Codex native recovery (${{ matrix.codex }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        codex:
          - installer
          - 0.156.1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck -- --pretty false
      - name: Install the exact supported native CLI
        id: codex
        env:
          CODEX_RELEASE: ${{ matrix.codex }}
        run: |
          codex_version="$CODEX_RELEASE"
          if [ "$codex_version" = installer ]; then
            codex_version="$(node --input-type=module -e 'import { CODEX_CLI_VERSION } from "./scripts/install-cloudx.mjs"; console.log(CODEX_CLI_VERSION)')"
          fi
          npm install --global --prefix "$RUNNER_TEMP/codex" --ignore-scripts --no-audit --no-fund "@openai/codex@$codex_version"
          printf 'version=%s\n' "$codex_version" >> "$GITHUB_OUTPUT"
      - name: Require production launch, permissions and conversation recovery
        env:
          CLOUDX_NATIVE_CODEX_VERSION: ${{ steps.codex.outputs.version }}
          CLOUDX_CODEX_VERIFICATION_DIAGNOSTICS_DIR: ${{ github.workspace }}/test-results/codex-verification
        run: CLOUDX_NATIVE_CODEX="$RUNNER_TEMP/codex/bin/codex" npm run test:codex-recovery
      - name: Retain private synthetic acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-verification-${{ matrix.codex }}-${{ github.sha }}
          path: test-results/codex-verification/
          if-no-files-found: warn
          retention-days: 14
  terminal-stress:
    name: Terminal stress (Node 22, 2 CPUs, 7 GiB)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the pinned terminal stress environment
        run: docker build --pull --tag cloudx-terminal-stress:${{ github.sha }} --file containers/ci/terminal-stress.Dockerfile .
      - name: Repeat terminal coverage with fixed resource limits
        run: |
          install -d test-results/terminal-stress
          docker run --rm \
            --init \
            --user "$(id -u):$(id -g)" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --cpus 2 \
            --memory 7g \
            --memory-swap 7g \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=8g,mode=1777 \
            --volume "${PWD}/test-results/terminal-stress:/work/test-results/terminal-stress:rw" \
            cloudx-terminal-stress:${{ github.sha }}
      - name: Upload every terminal stress outcome and diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminal-stress-${{ github.sha }}
          path: test-results/terminal-stress/
          if-no-files-found: error
          retention-days: 14
  python-services:
    name: Python services (pytest)
    if: always()
    needs:
      - isolated-lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          LANES_RESULT: ${{ needs.isolated-lanes.result }}
        run: test "$LANES_RESULT" = success
  browser:
    name: Browser smoke (desktop and mobile)
    if: always()
    needs:
      - isolated-lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          LANES_RESULT: ${{ needs.isolated-lanes.result }}
        run: test "$LANES_RESULT" = success
  isolated-verifier:
    name: Isolated full verifier
    if: always()
    needs:
      - isolated-lanes
      - coverage-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
      - name: Require every lane and the merged coverage thresholds
        env:
          LANES_RESULT: ${{ needs.isolated-lanes.result }}
          MERGE_RESULT: ${{ needs.coverage-merge.result }}
        run: test "$LANES_RESULT" = success && test "$MERGE_RESULT" = success
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: verifier-lane-*-${{ github.sha }}
          path: lane-results
      - run: node containers/ci/aggregate.mjs "${{ github.sha }}" lane-results verification-summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isolated-verifier-${{ github.sha }}
          path: verification-summary/aggregate.json
          if-no-files-found: error
          retention-days: 14
  identity:
    name: Trusted merge identity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: controller/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: controller
      - name: Record the exact tested merge from the trusted controller
        env:
          CI_IDENTITY_OUTPUT: ../ci-identity/identity.json
          CI_SOURCE_DIRECTORY: ../source
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PULL_REQUEST_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          CI_RECONCILIATION_OUTPUT: ../ci-identity/reconciliation.json
        run: |
          install -d -m 0700 ../ci-identity
          node scripts/ai-change/github/check-identity.mjs create-ci-artifact
        working-directory: controller
        id: record
      - name: Upload the one trusted CI identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudx-ci-identity-v2
          path: ci-identity/identity.json
          if-no-files-found: error
          retention-days: 14
        if: steps.record.outputs.identity-state == 'current'
      - name: Retain merge identity reconciliation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudx-ci-reconciliation
          path: ci-identity/reconciliation.json
          if-no-files-found: error
          retention-days: 14
    outputs:
      identity-state: ${{ steps.record.outputs.identity-state }}
  aggregate:
    name: CI aggregate
    if: always()
    needs:
      - policy
      - typescript
      - codex-native
      - terminal-stress
      - python-services
      - browser
      - isolated-verifier
      - identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every merge gate
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          CODEX_NATIVE_RESULT: ${{ needs.codex-native.result }}
          TERMINAL_STRESS_RESULT: ${{ needs.terminal-stress.result }}
          PYTHON_RESULT: ${{ needs.python-services.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          ISOLATED_VERIFIER_RESULT: ${{ needs.isolated-verifier.result }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          IDENTITY_STATE: ${{ needs.identity.outputs.identity-state }}
        run: |
          node --input-type=module <<'NODE'
          const expectedIdentity = process.env.WORKFLOW_EVENT === "pull_request" ? "success" : "skipped";
          for (const [name, result] of Object.entries(process.env)) {
            if (!name.endsWith("_RESULT")) continue;
            const expected = name === "IDENTITY_RESULT" ? expectedIdentity : "success";
            if (result !== expected) throw new Error(`${name} was ${result}; expected ${expected}`);
          }
          NODE

          if [ "$WORKFLOW_EVENT" = pull_request ]; then test "$IDENTITY_STATE" = current; fi
  isolated-lanes:
    name: Isolated verifier (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the immutable Gate B publication fixture
        if: startsWith(matrix.lane, 'coverage-')
        working-directory: source
        run: git fetch --no-tags origin 465896c9ec4da70af5f312db3a35d2c137a5513c
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the exact controller with immutable dependency layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: controller
          file: controller/containers/ci/Dockerfile
          load: true
          pull: true
          tags: cloudx-ci-verifier:${{ github.sha }}
          cache-from: type=gha,scope=cloudx-ci-node22-playwright160
          cache-to: type=gha,mode=max,scope=cloudx-ci-node22-playwright160
      - name: Run with no network and read-only source
        run: |
          install -d -m 0700 container-results
          install -m 0600 /dev/null container-results/results.json
          docker run --rm \
            --init \
            --network none \
            --read-only \
            --cap-drop ALL \
            --cap-add DAC_OVERRIDE \
            --cap-add SETUID \
            --cap-add SETGID \
            --cap-add KILL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 7g \
            --cpus 2 \
            --shm-size 1g \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=8g,mode=1777 \
            --volume "${PWD}/source:/source:ro" \
            --volume "${PWD}/container-results/results.json:/results/results.json:rw" \
            cloudx-ci-verifier:${{ github.sha }} "${{ matrix.lane }}" "${{ github.sha }}"
      - name: Upload exact verifier evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verifier-lane-${{ matrix.lane }}-${{ github.sha }}
          path: container-results/results.json
          if-no-files-found: error
          retention-days: 14
    strategy:
      fail-fast: false
      matrix:
        lane:
          - coverage-1
          - coverage-2
          - coverage-3
          - coverage-4
          - static
          - asr
          - documentation
          - browser-1
          - browser-2
  coverage-merge:
    name: Merged isolated coverage
    needs:
      - isolated-lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: verifier-lane-*-${{ github.sha }}
          path: lane-results
      - name: Require all exact coverage shards before reading blobs
        run: node controller/containers/ci/aggregate.mjs "${{ github.sha }}" lane-results coverage-input coverage
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the exact controller with immutable dependency layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: controller
          file: controller/containers/ci/Dockerfile
          load: true
          pull: true
          tags: cloudx-ci-verifier:${{ github.sha }}
          cache-from: type=gha,scope=cloudx-ci-node22-playwright160
          cache-to: type=gha,mode=max,scope=cloudx-ci-node22-playwright160
      - name: Merge coverage offline under the same candidate identity
        run: |
          install -d -m 0700 container-results
          install -m 0600 /dev/null container-results/results.json
          docker run --rm \
            --init \
            --network none \
            --read-only \
            --cap-drop ALL \
            --cap-add DAC_OVERRIDE \
            --cap-add SETUID \
            --cap-add SETGID \
            --cap-add KILL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 7g \
            --cpus 2 \
            --shm-size 1g \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=8g,mode=1777 \
            --volume "${PWD}/source:/source:ro" \
            --volume "${PWD}/container-results/results.json:/results/results.json:rw" \
            --volume "${PWD}/coverage-input:/inputs:ro" \
            cloudx-ci-verifier:${{ github.sha }} coverage-merge "${{ github.sha }}"
      - name: Upload merged coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verifier-lane-coverage-merge-${{ github.sha }}
          path: container-results/results.json
          if-no-files-found: error
          retention-days: 14
  superseded-identity:
    name: Superseded merge identity
    needs:
      - identity
    if: needs.identity.outputs.identity-state == 'superseded'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |-
          echo "This test merge is superseded. Test the newly reconciled base/head identity; rerunning this unchanged merge cannot authorize it."
          exit 1
  pending-identity:
    name: Pending merge identity
    needs:
      - identity
    if: needs.identity.outputs.identity-state == 'pending'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |-
          echo "GitHub is still computing this test merge. Wait for confirmed merge metadata and run CI for that identity; do not change application code."
          exit 1
